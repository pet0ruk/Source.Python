# ../data/source-python/weapons/scripts/orangebox/WeaponInfo.ini

# FileWeaponInfo_t (game/shared/weapon_parse.h) as the servers of CS:S, DoD:S, HL2DM and TF2
# lay it out; the offsets are the ones FileWeaponInfo_t::Parse writes to in their
# server_srv.so (bin/ for 32-bit, bin/linux64/ for x86_64). On x86_64 the vtable pointer and
# the CHudTexture pointers are 8 bytes, hence the offset_linux_x86_64 values.

