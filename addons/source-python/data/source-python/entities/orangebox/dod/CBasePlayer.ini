        offset_windows = 269

    # _ZN11CBasePlayer8PreThinkEv
    [[pre_think]]
        offset_linux = 339
        offset_windows = 338

    # _ZN11CBasePlayer9PostThinkEv
    [[post_think]]
        offset_linux = 340
        offset_windows = 339

    # _ZN11CBasePlayer16PlayerRunCommandEP8CUserCmdP11IMoveHelper
    [[run_command]]
        offset_linux = 426
        offset_windows = 425
        arguments = POINTER, POINTER
