# Builds minimal Source dedicated server images for testing (server from steamcmd, one map),
# pushed to ghcr.io/<owner>/srcds as <tag> (moving) and <tag>-<UTC stamp>, where <tag> is
# <game> for the runnable Linux server and <game>-windows for the Windows server files (a
# files-only image for Windows runners; see the targets in docker/srcds/Dockerfile). After a
# push, the previous image of that tag (left with only its dated tag) is deleted from the
# package. Per-game settings live in docker/srcds/games.json; docker/srcds/plan.sh decides what
# to build by comparing Steam's required version with the steam.required_version label on :<tag>.
name: srcds test images

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours; only outdated images are rebuilt
  workflow_dispatch:
    inputs:
      game:
        description: Game to build
        required: true
        type: choice
        default: all
        options: [all, tf2, css, dods, hl2dm, l4d2]
      platform:
        description: Platform to build
        required: true
        type: choice
        default: all
        options: [all, linux, windows]
      force:
        description: Force build (skip the version check)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: srcds

concurrency:
  group: srcds-images   # one run at a time, so cleanups never race another run's push
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Ensure skopeo
        run: command -v skopeo || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }

      - name: Check Steam versions against published images
        id: plan
        env:
          GAME: ${{ inputs.game || 'all' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          FORCE: ${{ inputs.force || false }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash docker/srcds/plan.sh

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: build (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      # Disk space: not needed at the moment. The current ubuntu-latest image (Ubuntu 26.04)
      # has ~87 GB free on / out of the box, and the largest build (l4d2: 9.2 GB download,
      # 7 GB pruned) needs well under that. Re-enable both steps below if a bigger game is
      # added (e.g. CS:GO: 33 GB download + 28 GB copy) or the runner image shrinks.
      #
      # Notes for when it is re-enabled:
      # - The build runs in the buildx builder, whose state volume lives under
      #   /var/lib/docker (the new mount). Images, though, go to containerd's store in
      #   /var/lib/containerd on / (this runner's Docker uses the containerd snapshotter)
      #   and setup-buildx pulls the BuildKit image there, so / needs headroom.
      # - The action carves one LVM PV out of / (leaving root-reserve-mb) and a second out
      #   of /mnt (leaving temp-reserve-mb). On Ubuntu 26.04 runners /mnt is not a separate
      #   disk, so the second PV eats /'s reserve and / ends with only temp-reserve-mb free
      #   (100 MB by default, which made the BuildKit pull fail with ENOSPC in run
      #   44906730500). Hence temp-reserve-mb = the headroom wanted, root-reserve-mb above it.
      #
      # - name: Maximize build space
      #   uses: easimon/maximize-build-space@v10 # v10
      #   with:
      #     build-mount-path: /var/lib/docker
      #     root-reserve-mb: '5120'
      #     temp-reserve-mb: '4096'
      #     remove-dotnet: 'true'
      #     remove-android: 'true'
      #     remove-haskell: 'true'
      #     remove-codeql: 'true'
      #
      # - name: Restart Docker on the new mount
      #   run: sudo systemctl restart docker && df -h /var/lib/docker

      - name: Disk space before build
        run: df -h /

      - uses: docker/setup-buildx-action@v4 # v4.4.1

      - uses: docker/login-action@v4 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tags }}
        uses: docker/build-push-action@v7 # v7.4.0
        with:
          context: docker/srcds
          file: docker/srcds/Dockerfile
          target: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ matrix.tags }}
          build-args: |
            GAME=${{ matrix.game }}
            APP_ID=${{ matrix.app_id }}
            GAME_DIR=${{ matrix.game_dir }}
            KEEP_MAP=${{ matrix.map }}
            REQUIRED_VERSION=${{ matrix.version }}
            WINDOWS_FIRST=${{ matrix.windows_first }}
            VERIFY_VERSION=${{ matrix.verify_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Delete previous ${{ matrix.tag }} images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          TAG: ${{ matrix.tag }}
          KEEP: ${{ matrix.tag }}-${{ matrix.stamp }}
        run: |
          set -euo pipefail
          scope=users; [ "$OWNER_TYPE" = Organization ] && scope=orgs
          base="/$scope/$OWNER/packages/container/$IMAGE/versions"
          # Old images of this tag: a "<tag>-<stamp>" tag (exactly; "tf2-<stamp>" must not
          # match "tf2-windows-<stamp>"), but neither "<tag>" nor this run's stamp (both of
          # which are on the image just pushed).
          ids=$(gh api --paginate "$base" | jq -r --arg t "$TAG" --arg keep "$KEEP" '
            .[] | select(.metadata.container.tags as $tags
                         | ($tags | index($t) | not) and ($tags | index($keep) | not)
                           and any($tags[]; test("^" + $t + "-[0-9]{8}-[0-9]{6}$")))
                | "\(.id) \(.metadata.container.tags | join(","))"')
          if [ -z "$ids" ]; then echo "no previous $TAG images"; fi
          while read -r id tags; do
            [ -n "$id" ] || continue
            echo "deleting version $id ($tags)"
            gh api -X DELETE "$base/$id"
          done <<<"$ids"

      - name: Disk usage after build
        if: always()
        run: df -h /; docker system df

