# Builds Source.Python from the branch under test and runs the functional tests from
# docker/harness on the srcds:<game> test images (see srcds-images.yml), one job per game and
# platform (Linux: srcds:<game>; Windows: the files of srcds:<game>-windows), and a 64-bit build
# on the 64-bit server of each game that has one (games.json: x86_64 for Linux, x86_64_windows
# for Windows). Run by hand with "metamod", Metamod:Source is installed next to Source.Python.
name: Source.Python tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      game:
        description: Game to test
        required: true
        type: choice
        default: all
        options: [all, tf2, css, dods, hl2dm, l4d2, csgo, bms]
      platform:
        description: Platform to test
        required: true
        type: choice
        default: all
        options: [all, linux, windows]
      metamod:
        description: Install Metamod:Source (latest 1.12 build) next to Source.Python
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: sp-tests-${{ github.event.pull_request.number || github.ref }}-${{ inputs.game || 'all' }}-${{ inputs.platform || 'all' }}-${{ inputs.metamod && 'metamod' || 'plain' }}
  cancel-in-progress: true

jobs:
  games:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      list_x86_64: ${{ steps.list.outputs.list_x86_64 }}
      list_x86_64_windows: ${{ steps.list.outputs.list_x86_64_windows }}
      linux: ${{ steps.list.outputs.linux }}
      windows: ${{ steps.list.outputs.windows }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - id: list
        env:
          GAME: ${{ inputs.game || 'all' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          echo "linux=$([ "$PLATFORM" != windows ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "windows=$([ "$PLATFORM" != linux ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$GAME" = all ]; then
            echo "list=$(jq -c keys_unsorted docker/srcds/games.json)" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(jq -cn --arg g "$GAME" '[$g]')" >> "$GITHUB_OUTPUT"
          fi
          # the games with a 64-bit server, of those selected
          echo "list_x86_64=$(jq -c --arg g "$GAME" '[to_entries[] | select(.value.x86_64 == true and ($g == "all" or .key == $g)) | .key]' docker/srcds/games.json)" >> "$GITHUB_OUTPUT"
          echo "list_x86_64_windows=$(jq -c --arg g "$GAME" '[to_entries[] | select(.value.x86_64_windows == true and ($g == "all" or .key == $g)) | .key]' docker/srcds/games.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: games
    if: needs.games.outputs.linux == 'true'
    name: test (${{ matrix.game }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.list) }}
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Output directory
        run: echo "OUT=$RUNNER_TEMP/sp-out" >> "$GITHUB_ENV"

      - name: Build Source.Python (${{ matrix.game }})
        run: docker/build/build.sh "$GAME" "$OUT/build"

      - uses: docker/login-action@v4 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metamod:Source
        if: inputs.metamod
        run: |
          docker/harness/tools/get_metamod.sh linux "$OUT/metamod"
          echo "EXTRA_ADDONS=$OUT/metamod" >> "$GITHUB_ENV"

      - name: Run tests on srcds:${{ matrix.game }}
        env:
          SRCDS_IMAGE: ghcr.io/${{ github.repository_owner }}/srcds
          # test the binaries as built: an executable stack would stop them loading (glibc >= 2.41)
        run: |
          set -o pipefail
          docker/harness/run.sh "$GAME" "$OUT/build/release" "$OUT/harness" | tee "$OUT/report.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### $GAME (hl2sdk $(cut -c1-9 "$OUT/build/hl2sdk.txt" 2>/dev/null || echo '?'))"
            echo '```text'
            sed -n '/^gamedata vtables/,$p' "$OUT/report.txt" 2>/dev/null || echo "no test report (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: sp-tests-${{ matrix.game }}
          if-no-files-found: ignore
          path: |
            ${{ env.OUT }}/report.txt
            ${{ env.OUT }}/build/build.log
            ${{ env.OUT }}/build/hl2sdk.txt
            ${{ env.OUT }}/harness/results.json
            ${{ env.OUT }}/harness/console.log
            ${{ env.OUT }}/harness/srcds_run.log
            ${{ env.OUT }}/harness/crash.txt
            ${{ env.OUT }}/harness/gamedata-vtables.txt
            ${{ env.OUT }}/harness/source-python-logs/

  # The same tests with a 64-bit build on the game's 64-bit server (srcds_run_64).
  test-x86_64:
    needs: games
    if: needs.games.outputs.linux == 'true' && needs.games.outputs.list_x86_64 != '[]'
    name: test (${{ matrix.game }}, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.list_x86_64) }}
    env:
      GAME: ${{ matrix.game }}
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Output directory
        run: echo "OUT=$RUNNER_TEMP/sp-out" >> "$GITHUB_ENV"

      - name: Build Source.Python (${{ matrix.game }}, x86_64)
        run: docker/build/build.sh "$GAME" "$OUT/build"

      - uses: docker/login-action@v4 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metamod:Source
        if: inputs.metamod
        run: |
          docker/harness/tools/get_metamod.sh linux "$OUT/metamod"
          echo "EXTRA_ADDONS=$OUT/metamod" >> "$GITHUB_ENV"

      - name: Run tests on srcds:${{ matrix.game }} (64-bit server)
        env:
          SRCDS_IMAGE: ghcr.io/${{ github.repository_owner }}/srcds
        run: |
          set -o pipefail
          docker/harness/run.sh "$GAME" "$OUT/build/release" "$OUT/harness" | tee "$OUT/report.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### $GAME x86_64 (hl2sdk $(cut -c1-9 "$OUT/build/hl2sdk.txt" 2>/dev/null || echo '?'))"
            echo '```text'
            sed -n '/^gamedata vtables/,$p' "$OUT/report.txt" 2>/dev/null || echo "no test report (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: sp-tests-${{ matrix.game }}-x86_64
          if-no-files-found: ignore
          path: |
            ${{ env.OUT }}/report.txt
            ${{ env.OUT }}/build/build.log
            ${{ env.OUT }}/build/hl2sdk.txt
            ${{ env.OUT }}/harness/results.json
            ${{ env.OUT }}/harness/console.log
            ${{ env.OUT }}/harness/srcds_run.log
            ${{ env.OUT }}/harness/crash.txt
            ${{ env.OUT }}/harness/gamedata-vtables.txt
            ${{ env.OUT }}/harness/source-python-logs/

  # The same tests on the Windows server: MSVC build (docker/build/build-windows.sh), then the
  # harness on the files of srcds:<game>-windows (docker/harness/run-windows.sh). Steps run in
  # Git Bash; OUT is the POSIX form of the runner's temp dir, the artifact paths its Windows form.
  test-windows:
    needs: games
    if: needs.games.outputs.windows == 'true'
    name: test-windows (${{ matrix.game }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.list) }}
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Output directory
        run: echo "OUT=$(cygpath -u "$RUNNER_TEMP")/sp-out" >> "$GITHUB_ENV"

      - name: Build Source.Python (${{ matrix.game }}, Windows)
        run: docker/build/build-windows.sh "$GAME" "$OUT/build"

      - name: Metamod:Source
        if: inputs.metamod
        run: |
          docker/harness/tools/get_metamod.sh windows "$OUT/metamod"
          echo "EXTRA_ADDONS=$OUT/metamod" >> "$GITHUB_ENV"

      - name: Run tests on srcds:${{ matrix.game }}-windows
        env:
          SRCDS_IMAGE: ghcr.io/${{ github.repository_owner }}/srcds
          CRASH_DUMPS: 1
        run: |
          set -o pipefail
          docker/harness/run-windows.sh "$GAME" "$OUT/build/release" "$OUT/harness" | tee "$OUT/report.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### $GAME, Windows (hl2sdk $(cut -c1-9 "$OUT/build/hl2sdk.txt" 2>/dev/null || echo '?'))"
            echo '```text'
            sed -n '/^gamedata vtables/,$p' "$OUT/report.txt" 2>/dev/null || echo "no test report (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: sp-tests-${{ matrix.game }}-windows
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/sp-out/report.txt
            ${{ runner.temp }}/sp-out/build/build.log
            ${{ runner.temp }}/sp-out/build/hl2sdk.txt
            ${{ runner.temp }}/sp-out/harness/results.json
            ${{ runner.temp }}/sp-out/harness/console.log
            ${{ runner.temp }}/sp-out/harness/srcds_run.log
            ${{ runner.temp }}/sp-out/harness/srcds.exitcode
            ${{ runner.temp }}/sp-out/harness/crash.txt
            ${{ runner.temp }}/sp-out/harness/dumps/
            ${{ runner.temp }}/sp-out/harness/source-python-logs/

  # The 64-bit Windows server of each game that has one (srcds_win64.exe; for CS:S, DoD:S and
  # HL2DM TF2's, see run-windows.sh).
  test-windows-x86_64:
    needs: games
    if: needs.games.outputs.windows == 'true' && needs.games.outputs.list_x86_64_windows != '[]'
    name: test-windows (${{ matrix.game }}, x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.games.outputs.list_x86_64_windows) }}
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ matrix.game }}
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Output directory
        run: echo "OUT=$(cygpath -u "$RUNNER_TEMP")/sp-out" >> "$GITHUB_ENV"

      - name: Build Source.Python (${{ matrix.game }}, Windows, x86_64)
        run: docker/build/build-windows.sh "$GAME" "$OUT/build"

      - name: Metamod:Source
        if: inputs.metamod
        run: |
          docker/harness/tools/get_metamod.sh windows "$OUT/metamod"
          echo "EXTRA_ADDONS=$OUT/metamod" >> "$GITHUB_ENV"

      - name: Run tests on srcds:${{ matrix.game }}-windows
        env:
          SRCDS_IMAGE: ghcr.io/${{ github.repository_owner }}/srcds
          CRASH_DUMPS: 1
        run: |
          set -o pipefail
          docker/harness/run-windows.sh "$GAME" "$OUT/build/release" "$OUT/harness" | tee "$OUT/report.txt"

      - name: Summary
        if: always()
        run: |
          {
            echo "### $GAME, Windows x86_64 (hl2sdk $(cut -c1-9 "$OUT/build/hl2sdk.txt" 2>/dev/null || echo '?'))"
            echo '```text'
            sed -n '/^gamedata vtables/,$p' "$OUT/report.txt" 2>/dev/null || echo "no test report (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: sp-tests-${{ matrix.game }}-windows-x86_64
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/sp-out/report.txt
            ${{ runner.temp }}/sp-out/build/build.log
            ${{ runner.temp }}/sp-out/build/hl2sdk.txt
            ${{ runner.temp }}/sp-out/harness/results.json
            ${{ runner.temp }}/sp-out/harness/console.log
            ${{ runner.temp }}/sp-out/harness/srcds_run.log
            ${{ runner.temp }}/sp-out/harness/srcds.exitcode
            ${{ runner.temp }}/sp-out/harness/crash.txt
            ${{ runner.temp }}/sp-out/harness/dumps/
            ${{ runner.temp }}/sp-out/harness/source-python-logs/
